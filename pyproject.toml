[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nassimdl"
version = "0.1.0"
description = "NassimDL — a high-speed multi-segment download manager"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nassim" },
]
keywords = ["download", "manager", "multi-segment", "async", "accelerator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.19",
    "typer>=0.9",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
    "aiofiles>=23.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "httpx>=0.24",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
nassimdl = "nassimdl.cli:app"

[project.urls]
Homepage = "https://github.com/nassim/nassimdl"
Repository = "https://github.com/nassim/nassimdl"
Issues = "https://github.com/nassim/nassimdl/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
