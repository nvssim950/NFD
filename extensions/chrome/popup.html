<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .title {
      font-weight: 700;
      font-size: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 12px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .toggle-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155; transition: .3s; border-radius: 22px;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #38bdf8; }
    input:checked + .slider:before { transform: translateX(18px); }
    .btn {
      display: block;
      width: 100%;
      padding: 8px 0;
      text-align: center;
      background: #0284c7;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ NFD Downloader</div>
  </div>
  <div class="status-indicator">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Checking NFD App...</span>
  </div>
  <div class="toggle-wrap">
    <span>Intercept Chrome Downloads</span>
    <label class="switch">
      <input type="checkbox" id="intercept-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div style="font-size:11px; color:#64748b; text-align:center;">
    Connected to native NFD Windows Desktop App
  </div>

  <script src="popup.js"></script>
</body>
</html>
